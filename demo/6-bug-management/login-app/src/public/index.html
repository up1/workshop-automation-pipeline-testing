<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <section id="login-view" data-testid="login-view">
      <h1 data-testid="login-title">Sign in</h1>
      <form id="login-form" data-testid="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" data-testid="username-input" autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" data-testid="password-input" autocomplete="current-password" />

        <p id="error" class="error" role="alert" data-testid="error-message" hidden></p>

        <button type="submit" data-testid="login-button">Login</button>
      </form>
    </section>

    <section id="welcome-view" data-testid="welcome-view" hidden>
      <h1 data-testid="welcome-message"></h1>
      <button type="button" data-testid="logout-button">Logout</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
